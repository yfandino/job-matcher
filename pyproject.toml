[project]
name = "resume-parser-agent"
version = "0.1.0"
description = "AI Resume Analyzer Agent using LangChain"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "textblob>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

